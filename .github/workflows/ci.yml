name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Package contents
        run: npm pack --dry-run
